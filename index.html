<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugendfussball Spielplan & Tabelle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        .filter-section {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-section label {
            font-weight: bold;
        }
        .filter-section select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #0056b3;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jugendfussball Spielplan</h1>
    
    <!-- Team-Filter Leiste -->
    <div class="filter-section">
        <label for="teamFilter">Nach Mannschaft filtern:</label>
        <select id="teamFilter" onchange="filterMatches()">
            <option value="alle">Alle Mannschaften anzeigen</option>
            <!-- Optionen werden dynamisch per JavaScript gefüllt oder können ergänzt werden -->
        </select>
    </div>

    <!-- Spielplan Tabelle -->
    <table id="matchTable">
        <thead>
            <tr>
                <th>Zeit / Datum</th>
                <th>Heimteam</th>
                <th>Gastteam</th>
                <th>Ergebnis</th>
            </tr>
        </thead>
        <tbody>
            <!-- Beispiel-Einträge (Hier kommen deine echten Spieldaten rein) -->
            <tr>
                <td>10:00</td>
                <td>SK Ebbs</td>
                <td>FC Kufstein</td>
                <td>- : -</td>
            </tr>
            <tr>
                <td>11:00</td>
                <td>FC Kufstein</td>
                <td>Team C</td>
                <td>- : -</td>
            </tr>
            <tr>
                <td>12:00</td>
                <td>Team D</td>
                <td>SK Ebbs</td>
                <td>- : -</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Funktion zum Extrahieren aller Mannschaften und Füllen des Dropdowns
    function populateTeamFilter() {
        const table = document.getElementById('matchTable');
        const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
        const teamSelect = document.getElementById('teamFilter');
        const teams = new Set();

        for (let row of rows) {
            const homeTeam = row.cells[1].innerText.trim();
            const awayTeam = row.cells[2].innerText.trim();
            if (homeTeam) teams.add(homeTeam);
            if (awayTeam) teams.add(awayTeam);
        }

        // Teams alphabetisch sortieren und als Optionen hinzufügen
        Array.from(teams).sort().forEach(team => {
            const option = document.createElement('option');
            option.value = team;
            option.textContent = team;
            teamSelect.appendChild(option);
        });
    }

    // Filter-Funktion, wenn eine Mannschaft ausgewählt wird
    function filterMatches() {
        const selectedTeam = document.getElementById('teamFilter').value;
        const table = document.getElementById('matchTable');
        const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');

        for (let row of rows) {
            const homeTeam = row.cells[1].innerText.trim();
            const awayTeam = row.cells[2].innerText.trim();

            if (selectedTeam === 'alle' || homeTeam === selectedTeam || awayTeam === selectedTeam) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        }
    }

    // Beim Laden der Seite die Dropdown-Liste initialisieren
    window.onload = function() {
        populateTeamFilter();
    };
</script>

</body>
</html>
