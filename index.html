<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Ebbs U12 - Meisterschaft 2026</title>
    <style>
        :root {
            --primary-color: #0f233e;
            --secondary-color: #16325c;
            --accent-color: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 16px;
        }

        header {
            text-align: center;
            padding: 10px 0 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.35rem;
            color: var(--primary-color);
            margin: 0 0 6px 0;
            font-weight: 700;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin: 24px 0 12px 0;
            font-weight: 700;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 4px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #fff;
        }

        th, td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .match-round {
            width: 35px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .team-home {
            flex: 1;
            text-align: right;
            padding-right: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-away {
            flex: 1;
            text-align: left;
            padding-left: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score-inputs {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-input {
            width: 36px;
            height: 32px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            background: #fff;
            color: var(--text-color);
        }

        .score-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
        }

        .colon {
            font-weight: bold;
            color: var(--text-muted);
        }

        .btn-container {
            position: sticky;
            bottom: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 0;
            text-align: center;
            margin-top: 20px;
            z-index: 10;
        }

        .update-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 35, 62, 0.3);
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            max-width: 320px;
        }

        .update-btn:active {
            transform: scale(0.98);
        }

        .update-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SK Ebbs U12 - Meisterschaft 2026</h1>
        <p>Ergebnisse eintragen & Tabellen automatisch berechnen</p>
    </header>

    <!-- GRUPPE WEISS -->
    <h2>Gruppe WEISS - Spielplan</h2>
    <div id="matches-weiss"></div>

    <h2>Tabelle Gruppe WEISS</h2>
    <div class="table-responsive">
        <table id="table-weiss">
            <thead>
                <tr>
                    <th style="width: 30px;">#</th>
                    <th>Team</th>
                    <th style="width: 35px; text-align: center;">Sp</th>
                    <th style="width: 60px; text-align: center;">Tore</th>
                    <th style="width: 35px; text-align: center;">Pkt</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- GRUPPE GRÜN -->
    <h2>Gruppe GRÜN - Spielplan</h2>
    <div id="matches-gruen"></div>

    <h2>Tabelle Gruppe GRÜN</h2>
    <div class="table-responsive">
        <table id="table-gruen">
            <thead>
                <tr>
                    <th style="width: 30px;">#</th>
                    <th>Team</th>
                    <th style="width: 35px; text-align: center;">Sp</th>
                    <th style="width: 60px; text-align: center;">Tore</th>
                    <th style="width: 35px; text-align: center;">Pkt</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="btn-container">
        <button class="update-btn" onclick="updateTables()">Ergebnisse & Tabelle aktualisieren</button>
    </div>
</div>

<script>
    const teamsWeiss = [
        "SK Ebbs", "Wörgl", "Erl", "Schwoich", "Niederndorf", 
        "Bad Häring sv.", "Kössen", "St.Johann B", "Walchsee", "Kufstein", "Bichlach B", "Söll"
    ];

    const teamsGruen = [
        "SK Ebbs", "Bichlach A", "Bruckhäusl", "Kirchberg (U11)", 
        "Kössen", "Pillerseetal", "Söll", "Waidring", "Kundl/Breitenbach", "St.Johann A"
    ];

    const matchesWeiss = [
        { round: 1, home: "SK Ebbs", away: "Kufstein", homeScore: 7, awayScore: 3 },
        { round: 1, home: "Schwoich", away: "Erl", homeScore: 2, awayScore: 1 },
        { round: 1, home: "Wörgl", away: "Bichlach B", homeScore: 8, awayScore: 1 },
        { round: 2, home: "Walchsee", away: "SK Ebbs", homeScore: 1, awayScore: 4 },
        { round: 2, home: "Erl", away: "Niederndorf", homeScore: 7, awayScore: 2 },
        { round: 2, home: "Kössen", away: "Walchsee", homeScore: "", awayScore: "" },
        { round: 3, home: "Niederndorf", away: "Bichlach B", homeScore: 4, awayScore: 2 },
        { round: 3, home: "SK Ebbs", away: "Wörgl", homeScore: "", awayScore: "" },
        { round: 3, home: "Wörgl", away: "Söll", homeScore: 19, awayScore: 3 },
        { round: 4, home: "Erl", away: "SK Ebbs", homeScore: "", awayScore: "" },
        { round: 5, home: "SK Ebbs", away: "Bichlach B", homeScore: "", awayScore: "" }
    ];

    const matchesGruen = [
        { round: 1, home: "SK Ebbs", away: "St.Johann A", homeScore: 8, awayScore: 2 },
        { round: 2, home: "Kundl/Breitenbach", away: "SK Ebbs", homeScore: 1, awayScore: 4 },
        { round: 3, home: "SK Ebbs", away: "Bichlach A", homeScore: "", awayScore: "" },
        { round: 4, home: "Söll", away: "SK Ebbs", homeScore: "", awayScore: "" },
        { round: 5, home: "SK Ebbs", away: "Waidring", homeScore: "", awayScore: "" },
        { round: 6, home: "SK Ebbs", away: "Pillerseetal", homeScore: "", awayScore: "" },
        { round: 7, home: "Kirchberg (U11)", away: "SK Ebbs", homeScore: "", awayScore: "" },
        { round: 8, home: "Kössen", away: "SK Ebbs", homeScore: "", awayScore: "" },
        { round: 9, home: "SK Ebbs", away: "Bruckhäusl", homeScore: "", awayScore: "" }
    ];

    function renderMatches() {
        const containerWeiss = document.getElementById('matches-weiss');
        containerWeiss.innerHTML = '';
        matchesWeiss.forEach((m, idx) => {
            containerWeiss.innerHTML += `
                <div class="match-row">
                    <div class="match-round">${m.round}. Rde</div>
                    <div class="team-home" title="${m.home}">${m.home}</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input" id="w-home-${idx}" value="${m.homeScore}" min="0">
                        <span class="colon">:</span>
                        <input type="number" class="score-input" id="w-away-${idx}" value="${m.awayScore}" min="0">
                    </div>
                    <div class="team-away" title="${m.away}">${m.away}</div>
                </div>
            `;
        });

        const containerGruen = document.getElementById('matches-gruen');
        containerGruen.innerHTML = '';
        matchesGruen.forEach((m, idx) => {
            containerGruen.innerHTML += `
                <div class="match-row">
                    <div class="match-round">${m.round}. Rde</div>
                    <div class="team-home" title="${m.home}">${m.home}</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input" id="g-home-${idx}" value="${m.homeScore}" min="0">
                        <span class="colon">:</span>
                        <input type="number" class="score-input" id="g-away-${idx}" value="${m.awayScore}" min="0">
                    </div>
                    <div class="team-away" title="${m.away}">${m.away}</div>
                </div>
            `;
        });
    }

    function calculateTable(teamList, matches, prefix) {
        let stats = {};
        teamList.forEach(t => {
            stats[t] = { name: t, played: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
        });

        matches.forEach((m, idx) => {
            const hInput = document.getElementById(`${prefix}-home-${idx}`);
            const aInput = document.getElementById(`${prefix}-away-${idx}`);
            if (!hInput || !aInput) return;

            const hVal = hInput.value.trim();
            const aVal = aInput.value.trim();

            if (hVal !== '' && aVal !== '') {
                const hGoals = parseInt(hVal, 10);
                const aGoals = parseInt(aVal, 10);

                if (!isNaN(hGoals) && !isNaN(aGoals)) {
                    if (stats[m.home]) {
                        stats[m.home].played++;
                        stats[m.home].goalsFor += hGoals;
                        stats[m.home].goalsAgainst += aGoals;
                        if (hGoals > aGoals) stats[m.home].points += 3;
                        else if (hGoals === aGoals) stats[m.home].points += 1;
                    }
                    if (stats[m.away]) {
                        stats[m.away].played++;
                        stats[m.away].goalsFor += aGoals;
                        stats[m.away].goalsAgainst += hGoals;
                        if (aGoals > hGoals) stats[m.away].points += 3;
                        else if (aGoals === hGoals) stats[m.away].points += 1;
                    }
                }
            }
        });

        let sortedTeams = Object.values(stats).sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            let diffA = a.goalsFor - a.goalsAgainst;
            let diffB = b.goalsFor - b.goalsAgainst;
            if (diffB !== diffA) return diffB - diffA;
            return b.goalsFor - a.goalsFor;
        });

        return sortedTeams;
    }

    function renderTable(sortedTeams, tableId) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = '';
        sortedTeams.forEach((t, index) => {
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: 600; color: var(--text-muted);">${index + 1}</td>
                    <td style="font-weight: 600;">${t.name}</td>
                    <td style="text-align: center;">${t.played}</td>
                    <td style="text-align: center;">${t.goalsFor}:${t.goalsAgainst}</td>
                    <td style="text-align: center; font-weight: bold;">${t.points}</td>
                </tr>
            `;
        });
    }

    function updateTables() {
        matchesWeiss.forEach((m, idx) => {
            m.homeScore = document.getElementById(`w-home-${idx}`).value;
            m.awayScore = document.getElementById(`w-away-${idx}`).value;
        });
        matchesGruen.forEach((m, idx) => {
            m.homeScore = document.getElementById(`g-home-${idx}`).value;
            m.awayScore = document.getElementById(`g-away-${idx}`).value;
        });

        const sortedWeiss = calculateTable(teamsWeiss, matchesWeiss, 'w');
        renderTable(sortedWeiss, 'table-weiss');

        const sortedGruen = calculateTable(teamsGruen, matchesGruen, 'g');
        renderTable(sortedGruen, 'table-gruen');
    }

    window.onload = function() {
        renderMatches();
        updateTables();
    };
</script>

</body>
</html>
