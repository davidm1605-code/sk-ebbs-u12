                opt.textContent = team;
                if (team === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        window.switchTab = function(tabId, evt) {
            document.querySelectorAll('.container > div.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tabs .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');
            renderAll();
        }

        window.switchSubTab = function(parentId, subId, evt) {
            const parent = document.getElementById(`tab-${parentId}`);
            if (!parent) return;
            parent.querySelectorAll('.sub-content').forEach(el => el.classList.remove('active'));
            parent.querySelectorAll('.sub-tab-btn').forEach(el => el.classList.remove('active'));
            
            const targetContent = document.getElementById(`sub-${parentId}-${subId}`) || document.getElementById(`${parentId}-${subId}`) || document.getElementById(`termene-${parentId}-${subId}`);
            if (targetContent) targetContent.classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');

            if (parentId === 'tabelle') {
                currentTableMode = subId;
                renderAll();
            }
        }

        window.filterGroup = function(tabName, groupType, btn) {
            const container = btn.parentElement;
            container.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (groupType === 'alle') {
                const selWeiss = document.getElementById('select-team-offen-weiss');
                const selGruen = document.getElementById('select-team-offen-gruen');
                if (selWeiss) selWeiss.value = "";
                if (selGruen) selGruen.value = "";
            }

            ['herbst', 'fruehjahr'].forEach(season => {
                const secWeiss = document.getElementById(`section-${tabName}-weiss-${season}`);
                const secGruen = document.getElementById(`section-${tabName}-gruen-${season}`);
                const quickWeiss = document.getElementById(`filtered-quick-view-weiss-${season}`);
                const quickGruen = document.getElementById(`filtered-quick-view-gruen-${season}`);
                const rowWeiss = document.getElementById(`filter-row-weiss`);
                const rowGruen = document.getElementById(`filter-row-gruen`);

                if (groupType === 'weiss') {
                    if(secWeiss) secWeiss.style.display = 'block';
                    if(secGruen) secGruen.style.display = 'none';
                    if(rowWeiss) rowWeiss.style.display = 'flex';
                    if(rowGruen) rowGruen.style.display = 'none';
                    if(quickWeiss) quickWeiss.style.display = document.getElementById('select-team-offen-weiss').value ? 'block' : 'none';
                    if(quickGruen) quickGruen.style.display = 'none';
                } else if (groupType === 'gruen') {
                    if(secWeiss) secWeiss.style.display = 'none';
                    if(secGruen) secGruen.style.display = 'block';
                    if(rowWeiss) rowWeiss.style.display = 'none';
                    if(rowGruen) rowGruen.style.display = 'flex';
                    if(quickWeiss) quickWeiss.style.display = 'none';
                    if(quickGruen) quickGruen.style.display = document.getElementById('select-team-offen-gruen').value ? 'block' : 'none';
                } else {
                    if(secWeiss) secWeiss.style.display = 'block';
                    if(secGruen) secGruen.style.display = 'block';
                    if(rowWeiss) rowWeiss.style.display = 'none';
                    if(rowGruen) rowGruen.style.display = 'none';
                    if(quickWeiss) quickWeiss.style.display = 'none';
                    if(quickGruen) quickGruen.style.display = 'none';
                }
            });
            renderAll();
        }

        window.toggleEditMode = function() {
            const body = document.body;
            const topGespieltBtn = document.getElementById("toggle-btn-top-gespielt");
            const topOffenBtn = document.getElementById("toggle-btn-top-offen");
            
            if (body.classList.contains("readonly-mode")) {
                body.classList.remove("readonly-mode"); body.classList.add("editable-mode");
                const activeText = "🔓 Schreibmodus Ein";
                if (topGespieltBtn) topGespieltBtn.innerHTML = activeText;
                if (topOffenBtn) topOffenBtn.innerHTML = activeText;
            } else {
                body.classList.remove("editable-mode"); body.classList.add("readonly-mode");
                const inactiveText = "🔒 Schreibmodus Aus";
                if (topGespieltBtn) topGespieltBtn.innerHTML = inactiveText;
                if (topOffenBtn) topOffenBtn.innerHTML = inactiveText;
            }
        }

        window.downloadICS = function(group, season) {
            const list = season === 'herbst' ? (group === 'weiss' ? scheduleWeissHerbst : scheduleGruenHerbst) : (group === 'weiss' ? scheduleWeissFruehjahr : scheduleGruenFruehjahr);
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SK Ebbs U12//Spielplan//DE\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";
            
            list.forEach(item => {
                const startDate = new Date(item.iso);
                const endDate = new Date(startDate.getTime() + 90 * 60000);
                function formatICSDate(date) { return date.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z"; }

                icsContent += "BEGIN:VEVENT\n";
                icsContent += `UID:sk-ebbs-u12-${group}-${season}-${item.round.replace(/[^a-zA-Z0-9]/g, "")}@skebbs.local\n`;
                icsContent += `DTSTAMP:${formatICSDate(new Date())}\n`;
                icsContent += `DTSTART:${formatICSDate(startDate)}\n`;
                icsContent += `DTEND:${formatICSDate(endDate)}\n`;
                icsContent += `SUMMARY:SK Ebbs - ${item.match}\n`;
                icsContent += `DESCRIPTION:Meisterschaftsspiel\\nRunde: ${item.round}\n`;
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `SK_Ebbs_${group}_${season}.ics`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function renderAll() {
            collectValues();
            const filterWeiss = document.getElementById('select-team-offen-weiss')?.value || "";
            const filterGruen = document.getElementById('select-team-offen-gruen')?.value || "";

            renderSchedule("schedule-weiss-herbst-list", scheduleWeissHerbst, dataWeissHerbst);
            renderSchedule("schedule-weiss-fruehjahr-list", scheduleWeissFruehjahr, dataWeissFruehjahr);
            renderSchedule("schedule-gruen-herbst-list", scheduleGruenHerbst, dataGruenHerbst);
            renderSchedule("schedule-gruen-fruehjahr-list", scheduleGruenFruehjahr, dataGruenFruehjahr);

            renderGroupContainer("weiss", "herbst", dataWeissHerbst, filterWeiss);
            renderGroupContainer("weiss", "fruehjahr", dataWeissFruehjahr, filterWeiss);
            renderGroupContainer("gruen", "herbst", dataGruenHerbst, filterGruen);
            renderGroupContainer("gruen", "fruehjahr", dataGruenFruehjahr, filterGruen);

            calculateTable("weiss", dataWeissHerbst, dataWeissFruehjahr);
            calculateTable("gruen", dataGruenHerbst, dataGruenFruehjahr);
        }

        function renderSchedule(containerId, list, groupData) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = "";
            const now = new Date();

            list.forEach(item => {
                const kickoff = new Date(item.iso);
                const matchEnd = new Date(kickoff.getTime() + 60 * 60000);
                let cssClass = "", badgeHtml = "", scoreText = "";

                const matchObj = groupData.find(m => m.round === item.round && m.home === item.home && m.away === item.away);
                const hasScore = matchObj && matchObj.homeGoals !== "" && matchObj.homeGoals !== undefined && matchObj.awayGoals !== "" && matchObj.awayGoals !== undefined;

                if (hasScore || now >= matchEnd) {
                    cssClass = "finished"; badgeHtml = '<span class="badge-finished">BEENDET</span>';
                    if (hasScore) scoreText = `<span style="font-weight: bold; font-size: 0.8rem; color: #f8fafc;">${matchObj.homeGoals}:${matchObj.awayGoals}</span>`;
                } else if (now >= kickoff && now < matchEnd) {
                    cssClass = "live"; badgeHtml = '<span class="badge-live">LÄUFT</span>';
                }

                const div = document.createElement("div");
                div.className = `schedule-row ${cssClass}`;
                div.innerHTML = `
                    <div class="schedule-header"><span>${item.round}</span><span>${item.dateStr}</span></div>
                    <div class="schedule-body">
                        <div class="schedule-team-home">${getTeamLogoHtml(item.home)} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.home}</span></div>
                        <div class="schedule-vs">vs.</div>
                        <div class="schedule-team-away"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.away}</span> ${getTeamLogoHtml(item.away)}</div>
                        <div class="schedule-score-box">${scoreText}<div>${badgeHtml}</div></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderGroupContainer(groupKey, seasonKey, groupData, filterTeam) {
            const playedContainer = document.getElementById(`matches-${groupKey}-${seasonKey}-played`);
            const openContainer = document.getElementById(`matches-${groupKey}-${seasonKey}-open`);
            const quickView = document.getElementById(`filtered-quick-view-${groupKey}-${seasonKey}`);
            const quickList = document.getElementById(`filtered-quick-list-${groupKey}-${seasonKey}`);
            const quickTitle = document.getElementById(`quick-view-title-${groupKey}-${seasonKey}`);

            if (!playedContainer || !openContainer) return;
            playedContainer.innerHTML = ""; 
            openContainer.innerHTML = ""; 
            if (quickList) quickList.innerHTML = "";

            let hasFilter = filterTeam && filterTeam !== "";

            groupData.forEach((m, index) => {
                const matchesFilter = !hasFilter || m.home === filterTeam || m.away === filterTeam;
                const isPlayed = m.homeGoals !== "" && m.homeGoals !== undefined && m.awayGoals !== "" && m.awayGoals !== undefined;
                
                const createMatchDiv = () => {
                    const div = document.createElement("div");
                    div.className = "match";
                    div.innerHTML = `
                        <span class="round">${m.round}</span>
                        <div class="team-home">${getTeamLogoHtml(m.home)} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.home}</span></div>
                        <div class="score-inputs">
                            <input type="text" data-group="${groupKey}" data-season="${seasonKey}" data-index="${index}" data-type="h" value="${m.homeGoals !== undefined ? m.homeGoals : ''}"> 
                            <span>:</span> 
                            <input type="text" data-group="${groupKey}" data-season="${seasonKey}" data-index="${index}" data-type="a" value="${m.awayGoals !== undefined ? m.awayGoals : ''}">
                        </div>
                        <div class="team-away"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.away}</span> ${getTeamLogoHtml(m.away)}</div>
                    `;
                    return div;
                };

                if (isPlayed) {
                    playedContainer.appendChild(createMatchDiv());
                } else {
                    if (matchesFilter) {
                        openContainer.appendChild(createMatchDiv());
                    }
                    if (hasFilter && matchesFilter) {
                        if (quickList) quickList.appendChild(createMatchDiv());
                    }
                }
            });

            if (playedContainer.children.length === 0) {
                playedContainer.innerHTML = `<div style="font-size: 0.75rem; color: #64748b; font-style: italic; padding: 4px 0;">Keine gespielten Spiele vorhanden.</div>`;
            }
            if (openContainer.children.length === 0) {
                openContainer.innerHTML = `<div style="font-size: 0.75rem; color: #64748b; font-style: italic; padding: 4px 0;">Keine offenen Spiele vorhanden.</div>`;
            }

            if (quickView && quickList && quickTitle) {
                if (hasFilter) {
                    quickView.style.display = 'block';
                    quickTitle.textContent = `Offene Spiele für: ${filterTeam}`;
                    if (quickList.children.length === 0) quickList.innerHTML = `<div style="font-size: 0.75rem; color: #64748b; font-style: italic; padding: 4px 0;">Keine offenen Spiele.</div>`;
                } else {
                    quickView.style.display = 'none';
                }
            }
        }

        function collectValues() {
            document.querySelectorAll('input[data-group]').forEach(input => {
                const group = input.dataset.group;
                const season = input.dataset.season;
                const index = parseInt(input.dataset.index);
                const type = input.dataset.type;

                let targetArray = null;
                if (group === 'weiss' && season === 'herbst') targetArray = dataWeissHerbst;
                else if (group === 'weiss' && season === 'fruehjahr') targetArray = dataWeissFruehjahr;
                else if (group === 'gruen' && season === 'herbst') targetArray = dataGruenHerbst;
                else if (group === 'gruen' && season === 'fruehjahr') targetArray = dataGruenFruehjahr;

                if (targetArray && targetArray[index]) {
                    if (type === 'h') {
                        targetArray[index].homeGoals = input.value.trim();
                    } else if (type === 'a') {
                        targetArray[index].awayGoals = input.value.trim();
                    }
                }
            });
        }

        // Globaler Event-Listener für Eingaben, der Live-Aktualisierung und synchrones Speichern aus der Quick-View sicherstellt
        document.addEventListener('input', function(e) {
            if (e.target && e.target.matches('input[data-group]')) {
                collectValues();
                calculateTable("weiss", dataWeissHerbst, dataWeissFruehjahr);
                calculateTable("gruen", dataGruenHerbst, dataGruenFruehjahr);
                
                // Synchronisiere Duplikate (z.B. wenn dasselbe Spiel in der Quick-View und der Hauptliste gleichzeitig existiert)
                const group = e.target.dataset.group;
                const season = e.target.dataset.season;
                const index = e.target.dataset.index;
                const type = e.target.dataset.type;
                const val = e.target.value;

                document.querySelectorAll(`input[data-group="${group}"][data-season="${season}"][data-index="${index}"][data-type="${type}"]`).forEach(inp => {
                    if (inp !== e.target) {
                        inp.value = val;
                    }
                });
            }
        });

        window.syncAndUpdate = function() {
            collectValues();
            calculateTable("weiss", dataWeissHerbst, dataWeissFruehjahr);
            calculateTable("gruen", dataGruenHerbst, dataGruenFruehjahr);
        }

        function calculateTable(groupKey, herbstData, fruehjahrData) {
            const teams = groupKey === 'weiss' ? teamsWeiss : teamsGruen;
            const stats = {};
            teams.forEach(team => { stats[team] = { sp: 0, goalsFor: 0, goalsAgainst: 0, pts: 0 }; });

            let datasetsToProcess = [];
            if (currentTableMode === 'herbst') datasetsToProcess = [herbstData];
            else if (currentTableMode === 'fruehjahr') datasetsToProcess = [fruehjahrData];
            else datasetsToProcess = [herbstData, fruehjahrData];

            datasetsToProcess.forEach(dataset => {
                dataset.forEach(m => {
                    const hVal = m.homeGoals, aVal = m.awayGoals;
                    if (hVal !== "" && !isNaN(hVal) && aVal !== "" && !isNaN(aVal)) {
                        const hG = parseInt(hVal), aG = parseInt(aVal);
                        if (stats[m.home]) { stats[m.home].sp++; stats[m.home].goalsFor += hG; stats[m.home].goalsAgainst += aG; }
                        if (stats[m.away]) { stats[m.away].sp++; stats[m.away].goalsFor += aG; stats[m.away].goalsAgainst += hG; }
                        if (hG > aG) { if (stats[m.home]) stats[m.home].pts += 3; }
                        else if (hG < aG) { if (stats[m.away]) stats[m.away].pts += 3; }
                        else { if (stats[m.home]) stats[m.home].pts += 1; if (stats[m.away]) stats[m.away].pts += 1; }
                    }
                });
            });

            const sortedTeams = [...teams].sort((a, b) => {
                const sA = stats[a], sB = stats[b];
                if (sB.pts !== sA.pts) return sB.pts - sA.pts;
                const diffA = sA.goalsFor - sA.goalsAgainst, diffB = sB.goalsFor - sB.goalsAgainst;
                if (diffB !== diffA) return diffB - diffA;
                if (sB.goalsFor !== sA.goalsFor) return sB.goalsFor - sA.goalsFor;
                return a.localeCompare(b);
            });

            const tbody = document.getElementById(`table-${groupKey}`);
            if (!tbody) return;
            tbody.innerHTML = "";

            sortedTeams.forEach((team, idx) => {
                const s = stats[team];
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td><div style="display: flex; align-items: center; gap: 4px; overflow: hidden;">${getTeamLogoHtml(team)} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${team}</span></div></td>
                    <td>${s.sp}</td>
                    <td>${s.goalsFor}:${s.goalsAgainst}</td>
                    <td><strong>${s.pts}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadFromFirebase() {
            try {
                const docSnap = await getDoc(doc(db, "matchdata", "seasons"));
                if (docSnap.exists()) {
                    const saved = docSnap.data();
                    
                    const applySavedData = (targetList, savedList) => {
                        if (!savedList) return;
                        savedList.forEach(savedItem => {
                            const match = targetList.find(m => m.round === savedItem.round && m.home === savedItem.home && m.away === savedItem.away);
                            if (match) {
                                match.homeGoals = savedItem.homeGoals !== undefined ? savedItem.homeGoals : "";
                                match.awayGoals = savedItem.awayGoals !== undefined ? savedItem.awayGoals : "";
                            }
                        });
                    };

                    applySavedData(dataWeissHerbst, saved.weissHerbst);
                    applySavedData(dataWeissFruehjahr, saved.weissFruehjahr);
                    applySavedData(dataGruenHerbst, saved.gruenHerbst);
                    applySavedData(dataGruenFruehjahr, saved.gruenFruehjahr);
                }
            } catch (e) { 
                console.error("Firebase Ladefehler:", e); 
            }
            initSelectOptions();
            renderAll();
        }

        window.triggerUpdate = async function() {
            collectValues();
            try {
                await setDoc(doc(db, "matchdata", "seasons"), {
                    weissHerbst: dataWeissHerbst.map(m => ({ round: m.round, home: m.home, away: m.away, homeGoals: m.homeGoals, awayGoals: m.awayGoals })),
                    weissFruehjahr: dataWeissFruehjahr.map(m => ({ round: m.round, home: m.home, away: m.home, homeGoals: m.homeGoals, awayGoals: m.homeGoals })),
                    gruenHerbst: dataGruenHerbst.map(m => ({ round: m.round, home: m.home, away: m.home, homeGoals: m.homeGoals, awayGoals: m.homeGoals })),
                    gruenFruehjahr: dataGruenFruehjahr.map(m => ({ round: m.round, home: m.home, away: m.home, homeGoals: m.homeGoals, awayGoals: m.homeGoals }))
                });
                alert("Erfolgreich in Firebase gespeichert!");
                renderAll(); 
            } catch (e) { 
                console.error("Fehler beim Speichern:", e);
                alert("Fehler beim Speichern."); 
            }
        }

        initSelectOptions();
        loadFromFirebase();
    </script>
