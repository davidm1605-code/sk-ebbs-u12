        const scheduleGruen = [
            { round: "1. Rde", dateStr: "Fr, 04.09.2026 | 18:30", iso: "2026-09-04T18:30:00", match: "SK Ebbs vs. St. Johann A", home: "SK Ebbs", away: "St.Johann A" },

            { round: "3. Rde", dateStr: "Sa, 19.09.2026 | 12:00", iso: "2026-09-19T12:00:00", match: "SK Ebbs vs. Bichlach A", home: "SK Ebbs", away: "Bichlach A" },

            { round: "5. Rde", dateStr: "Sa, 03.10.2026 | 11:30", iso: "2026-10-03T11:30:00", match: "SK Ebbs vs. SK Waidring", home: "SK Ebbs", away: "Waidring" },
            { round: "6. Rde", dateStr: "Sa, 10.10.2026 | 12:00", iso: "2026-10-10T12:00:00", match: "SK Ebbs vs. SK Pillerseetal", home: "SK Ebbs", away: "Pillerseetal" },
            { round: "7. Rde", dateStr: "Sa, 17.10.2026 | 11:30", iso: "2026-10-17T11:30:00", match: "SC Kirchberg vs. SK Ebbs", home: "Kirchberg (U11)", away: "SK Ebbs" },
            { round: "8. Rde", dateStr: "Sa, 24.10.2026 | 12:00", iso: "2026-10-24T12:00:00", match: "FC Kössen vs. SK Ebbs", home: "Kössen", away: "SK Ebbs" },
            { round: "9. Rde", dateStr: "Do, 29.10.2026 | 17:00", iso: "2026-10-29T17:00:00", match: "SK Ebbs vs. SV Bruckhäusl", home: "SK Ebbs", away: "Bruckhäusl" }
        ];

        function generateAllMatches(teams) {
            const matches = [];
            let roundCounter = 1;
            for (let i = 0; i < teams.length; i++) {
                for (let j = i + 1; j < teams.length; j++) {
                    matches.push({
                        round: `${roundCounter}. Rde`,
                        home: teams[i],
                        away: teams[j],
                        homeGoals: "",
                        awayGoals: ""
                    });
                    roundCounter++;
                }
            }
            return matches;
        }

        const teamsWeiss = ["SK Ebbs", "Wörgl", "Erl", "Schwoich", "Niederndorf", "Bad Häring sv.", "Kössen", "St.Johann B", "Walchsee", "Kufstein", "Bichlach B", "Söll"];
        const teamsGruen = ["SK Ebbs", "Bichlach A", "Bruckhäusl", "Kirchberg (U11)", "Kössen", "Pillerseetal", "Söll", "Waidring", "Kundl/Breitenbach", "St.Johann A"];

        const initialWeissResults = {
            "SK Ebbs-Kufstein": { h: "7", a: "3" },
            "Walchsee-SK Ebbs": { h: "1", a: "4" },
            "Niederndorf-Bichlach B": { h: "4", a: "2" },
            "Erl-Niederndorf": { h: "7", a: "2" },
            "Schwoich-Erl": { h: "2", a: "1" },
            "Wörgl-Söll": { h: "19", a: "3" },
            "Wörgl-Bichlach B": { h: "8", a: "1" }
        };

        const initialGruenResults = {
            "SK Ebbs-St.Johann A": { h: "8", a: "2" },
            "Kundl/Breitenbach-SK Ebbs": { h: "1", a: "4" }
        };

        function populateMatches(teams, initialResults) {
            const generated = generateAllMatches(teams);
            return generated.map(m => {
                const key1 = `${m.home}-${m.away}`;
                const key2 = `${m.away}-${m.home}`;
                if (initialResults[key1]) {
                    m.homeGoals = initialResults[key1].h;
                    m.awayGoals = initialResults[key1].a;
                } else if (initialResults[key2]) {
                    m.homeGoals = initialResults[key2].a;
                    m.awayGoals = initialResults[key2].h;
                }
                return m;
            });
        }

        let dataWeiss = { teams: teamsWeiss, matches: populateMatches(teamsWeiss, initialWeissResults) };
        let dataGruen = { teams: teamsGruen, matches: populateMatches(teamsGruen, initialGruenResults) };

        window.switchTab = function(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
        }

        window.toggleEditMode = function() {
            const body = document.body;
            const topBtn = document.getElementById("toggle-btn-top");
            const bottomBtn = document.getElementById("toggle-btn-bottom");
            
            if (body.classList.contains("readonly-mode")) {
                body.classList.remove("readonly-mode");
                body.classList.add("editable-mode");
                const activeText = "🔓 Schreibmodus Ein";
                topBtn.innerHTML = activeText;
                bottomBtn.innerHTML = activeText;
            } else {
                body.classList.remove("editable-mode");
                body.classList.add("readonly-mode");
                const inactiveText = "🔒 Schreibmodus Aus";
                topBtn.innerHTML = inactiveText;
                bottomBtn.innerHTML = inactiveText;
            }
        }

        function renderAll() {
            renderSchedule("schedule-weiss-list", scheduleWeiss, dataWeiss);
            renderSchedule("schedule-gruen-list", scheduleGruen, dataGruen);
            renderGroupContainer("weiss", dataWeiss);
            renderGroupContainer("gruen", dataGruen);
            calculateTable("weiss", dataWeiss);
            calculateTable("gruen", dataGruen);
        }

        function findMatchGoals(groupData, homeTeam, awayTeam) {
            const match = groupData.matches.find(m => 
                (m.home === homeTeam && m.away === awayTeam) || 
                (m.home === awayTeam && m.away === homeTeam)
            );
            if (!match) return null;
            if (match.home === homeTeam) {
                return { h: match.homeGoals, a: match.awayGoals };
            } else {
                return { h: match.awayGoals, a: match.homeGoals };
            }
        }

        function renderSchedule(containerId, list, groupData) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            const now = new Date();

            list.forEach(item => {
                const kickoff = new Date(item.iso);
                const matchEnd = new Date(kickoff.getTime() + 60 * 60000);
                
                let cssClass = "";
                let badgeHtml = "";
                let scoreText = "";

                const goals = findMatchGoals(groupData, item.home, item.away);
                const hasScore = goals && goals.h !== "" && goals.a !== "";

                if (hasScore || now >= matchEnd) {
                    cssClass = "finished";
                    badgeHtml = '<span class="badge-finished">BEENDET</span>';
                    if (hasScore) {
                        scoreText = `<span style="font-weight: bold; font-size: 0.8rem; color: #f8fafc;">${goals.h}:${goals.a}</span>`;
                    }
                } else if (now >= kickoff && now < matchEnd) {
                    cssClass = "live";
                    badgeHtml = '<span class="badge-live">LÄUFT</span>';
                    if (hasScore) {
                        scoreText = `<span style="font-weight: bold; font-size: 0.8rem; color: #f8fafc;">${goals.h}:${goals.a}</span>`;
                    }
                }

                const homeLogo = getTeamLogoHtml(item.home);
                const awayLogo = getTeamLogoHtml(item.away);

                const div = document.createElement("div");
                div.className = `schedule-row ${cssClass}`;
                div.innerHTML = `
                    <div class="schedule-header">
                        <span>${item.round}</span>
                        <span>${item.dateStr}</span>
                    </div>
                    <div class="schedule-body">
                        <div class="schedule-team-home">
                            ${homeLogo} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.home}</span>
                        </div>
                        <div class="schedule-vs">vs.</div>
                        <div class="schedule-team-away">
                            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.away}</span> ${awayLogo}
                        </div>
                        <div class="schedule-score-box">
                            ${scoreText}
                            <div>${badgeHtml}</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderGroupContainer(groupKey, groupData) {
            const playedContainer = document.getElementById(`matches-${groupKey}-played`);
            const openContainer = document.getElementById(`matches-${groupKey}-open`);
            playedContainer.innerHTML = "";
            openContainer.innerHTML = "";

            groupData.matches.forEach((m, index) => {
                const isPlayed = m.homeGoals !== "" && m.awayGoals !== "";
                const targetContainer = isPlayed ? playedContainer : openContainer;

                const homeLogo = getTeamLogoHtml(m.home);
                const awayLogo = getTeamLogoHtml(m.away);

                const div = document.createElement("div");
                div.className = "match";
                div.innerHTML = `
                    <span class="round">${m.round}</span>
                    <div class="team-home">${homeLogo} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.home}</span></div>
                    <div class="score-inputs">
                        <input type="text" id="${groupKey}-h-${index}" value="${m.homeGoals}" oninput="syncAndUpdate()"> 
                        <span>:</span> 
                        <input type="text" id="${groupKey}-a-${index}" value="${m.awayGoals}" oninput="syncAndUpdate()">
                    </div>
                    <div class="team-away"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.away}</span> ${awayLogo}</div>
                `;
                targetContainer.appendChild(div);
            });
        }

        function collectValues(groupKey, groupData) {
            groupData.matches.forEach((m, index) => {
                const hInput = document.getElementById(`${groupKey}-h-${index}`);
                const aInput = document.getElementById(`${groupKey}-a-${index}`);
                if (hInput && aInput) {
                    m.homeGoals = hInput.value.trim();
                    m.awayGoals = aInput.value.trim();
                }
            });
        }

        window.syncAndUpdate = function() {
            collectValues("weiss", dataWeiss);
            collectValues("gruen", dataGruen);
            renderSchedule("schedule-weiss-list", scheduleWeiss, dataWeiss);
            renderSchedule("schedule-gruen-list", scheduleGruen, dataGruen);
            calculateTable("weiss", dataWeiss);
            calculateTable("gruen", dataGruen);
        }

        function calculateTable(groupKey, groupData) {
            const stats = {};
            groupData.teams.forEach(team => {
                stats[team] = { sp: 0, goalsFor: 0, goalsAgainst: 0, pts: 0 };
            });

            groupData.matches.forEach((m) => {
                const hVal = m.homeGoals;
                const aVal = m.awayGoals;

                if (hVal !== "" && aVal !== "" && !isNaN(hVal) && !isNaN(aVal)) {
                    const hG = parseInt(hVal);
                    const aG = parseInt(aVal);

                    if (stats[m.home]) {
                        stats[m.home].sp += 1;
                        stats[m.home].goalsFor += hG;
                        stats[m.home].goalsAgainst += aG;
                    }
                    if (stats[m.away]) {
                        stats[m.away].sp += 1;
                        stats[m.away].goalsFor += aG;
                        stats[m.away].goalsAgainst += hG;
                    }

                    if (hG > aG) {
                        if (stats[m.home]) stats[m.home].pts += 3;
                    } else if (hG < aG) {
                        if (stats[m.away]) stats[m.away].pts += 3;
                    } else {
                        if (stats[m.home]) stats[m.home].pts += 1;
                        if (stats[m.away]) stats[m.away].pts += 1;
                    }
                }
            });

            const sortedTeams = [...groupData.teams].sort((a, b) => {
                const sA = stats[a];
                const sB = stats[b];
                if (sB.pts !== sA.pts) return sB.pts - sA.pts;
                const diffA = sA.goalsFor - sA.goalsAgainst;
                const diffB = sB.goalsFor - sB.goalsAgainst;
                if (diffB !== diffA) return diffB - diffA;
                if (sB.goalsFor !== sA.goalsFor) return sB.goalsFor - sA.goalsFor;
                return a.localeCompare(b);
            });

            const tbody = document.getElementById(`table-${groupKey}`);
            tbody.innerHTML = "";

            sortedTeams.forEach((team, idx) => {
                const s = stats[team];
                const logoHtml = getTeamLogoHtml(team);
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td><div style="display: flex; align-items: center; gap: 4px; overflow: hidden;">${logoHtml} <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${team}</span></div></td>
                    <td>${s.sp}</td>
                    <td>${s.goalsFor}:${s.goalsAgainst}</td>
                    <td><strong>${s.pts}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadFromFirebase() {
            try {
                const docRef = doc(db, "matchdata", "seasons");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const savedData = docSnap.data();
                    if (savedData.weiss) {
                        savedData.weiss.forEach((gMatch, idx) => {
                            if (dataWeiss.matches[idx]) {
                                dataWeiss.matches[idx].homeGoals = gMatch.homeGoals !== undefined ? gMatch.homeGoals : "";
                                dataWeiss.matches[idx].awayGoals = gMatch.awayGoals !== undefined ? gMatch.awayGoals : "";
                            }
                        });
                    }
                    if (savedData.gruen) {
                        savedData.gruen.forEach((gMatch, idx) => {
                            if (dataGruen.matches[idx]) { // <-- HIER WAR DER FEHLER (vorher stand hier .matches.match[idx])
                                dataGruen.matches[idx].homeGoals = gMatch.homeGoals !== undefined ? gMatch.homeGoals : "";
                                dataGruen.matches[idx].awayGoals = gMatch.awayGoals !== undefined ? gMatch.awayGoals : "";
                            }
                        });
                    }
                }
            } catch (e) {
                console.error("Fehler beim Laden aus Firebase: ", e);
            }
            renderAll();
        }

        window.triggerUpdate = async function() {
            collectValues("weiss", dataWeiss);
            collectValues("gruen", dataGruen);
            renderAll();

            try {
                await setDoc(doc(db, "matchdata", "seasons"), {
                    weiss: dataWeiss.matches.map(m => ({ homeGoals: m.homeGoals, awayGoals: m.awayGoals })),
                    gruen: dataGruen.matches.map(m => ({ homeGoals: m.homeGoals, awayGoals: m.awayGoals }))
                });
                alert("Erfolge erfolgreich in der Cloud (Firebase) gespeichert!");
            } catch (e) {
                console.error("Fehler beim Speichern: ", e);
                alert("Fehler beim Speichern in Firebase.");
            }
        }

        loadFromFirebase();
    </script>
